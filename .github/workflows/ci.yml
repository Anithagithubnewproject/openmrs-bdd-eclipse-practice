name: OpenMRS BDD Hybrid Suite

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  regression:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Start local OpenMRS reference app (Docker)
        run: docker compose up -d

      - name: Wait for OpenMRS to become healthy
        run: |
          for i in $(seq 1 90); do
            status=$(docker inspect --format='{{.State.Health.Status}}' $(docker compose ps -q openmrs) 2>/dev/null || echo starting)
            if [ "$status" = "healthy" ]; then
              echo "OpenMRS is healthy after $((i*10))s"
              exit 0
            fi
            sleep 10
          done
          echo "OpenMRS did not become healthy in time"
          docker compose logs --tail 100 openmrs
          exit 1

      - name: Run Cucumber regression suite (headless)
        id: run_tests
        run: mvn -B clean test -Dheadless=true
        continue-on-error: true

      - name: Dump OpenMRS container logs on failure
        if: steps.run_tests.outcome == 'failure'
        run: docker compose logs --tail 200 openmrs

      - name: Upload Cucumber report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: target/cucumber-reports/
          retention-days: 14

      - name: Upload Surefire results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-results
          path: target/surefire-reports/
          retention-days: 14

      - name: Stop containers
        if: always()
        run: docker compose down -v

      - name: Fail the job if tests failed
        if: steps.run_tests.outcome == 'failure'
        run: exit 1
