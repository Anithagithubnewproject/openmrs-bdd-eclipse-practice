services:
  openmrs-db:
    restart: "always"
    image: mysql:5.6
    command: "mysqld --character-set-server=utf8 --collation-server=utf8_general_ci"
    environment:
      MYSQL_DATABASE: ${MYSQL_DB:-openmrs}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Admin123}
      MYSQL_USER: ${MYSQL_USER:-openmrs}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-Admin123}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-Admin123}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - openmrs-db-data:/var/lib/mysql

  openmrs:
    restart: "always"
    image: openmrs/openmrs-reference-application:2.13.0
    depends_on:
      - openmrs-db
    ports:
      - "8080:8080"
    environment:
      OMRS_DB_NAME: ${MYSQL_DB:-openmrs}
      OMRS_DB_HOSTNAME: openmrs-db
      OMRS_DB_USERNAME: ${MYSQL_USER:-openmrs}
      OMRS_DB_PASSWORD: ${MYSQL_PASSWORD:-Admin123}
      OMRS_CREATE_TABLES: 'true'
      OMRS_AUTO_UPDATE_DATABASE: 'true'
      OMRS_MODULE_WEB_ADMIN: 'true'
      OMRS_ADMIN_USER_PASSWORD: Admin123
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8080/openmrs/ws/rest/v1/session | grep -q authenticated"]
      interval: 30s
      timeout: 10s
      retries: 40
      start_period: 120s

volumes:
  openmrs-db-data:
